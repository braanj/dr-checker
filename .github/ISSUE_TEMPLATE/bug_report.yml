name: Bug report
description: Something on DR Checker doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Found a security problem? Please don't file it here. Report it privately as described in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /domains
        2. Filter by TLD "io"
        3. ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page or URL
      placeholder: https://dr-bulkchecker.netlify.app/domains?tld=io
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on macOS, Safari on iPhone
